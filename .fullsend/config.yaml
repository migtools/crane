version: "1"
forge: github
runtime: claude
roles:
  - triage
  - coder
  - review
  - fix
  - retro
  - prioritize

mint_url: https://mint.fullsend.sh
inference:
  provider: vertex
  region: global
  # Workflows pass vars.VERTEX_PROJECT_ID and vars.VERTEX_WIF_PROVIDER
  # through the reusable workflow's FULLSEND_GCP_* interface.

tracker:
  github:
    allowed_targets:
      repos:
        - migtools/crane

# Use role-specific models, disable triage auto-code, and keep retro/prioritize request-only.
agents:
  - name: triage
    source: https://raw.githubusercontent.com/fullsend-ai/agents/ea29de9bb8b1729b04c0597b48a5c7aae62deb71/harness/triage.yaml#sha256=ce30d5eea5c13c7cf33a7feffa9342d33cb918d485d0587c1030e04766884a0d
    enabled: true
    model: claude-sonnet-4-6
    harness:
      env:
        runner:
          TRIAGE_AUTO_CODE: "off"
        sandbox:
          TRIAGE_AUTO_CODE: "off"
  - name: review
    source: https://raw.githubusercontent.com/fullsend-ai/agents/ea29de9bb8b1729b04c0597b48a5c7aae62deb71/harness/review.yaml#sha256=c31ab2ff59b288ad1b8e3755751549c00c1606649cdb239bbbe5df58ba6f3112
    enabled: true
    runtime: pi
    model: anthropic-vertex/claude-sonnet-4-6
    subagents:
      correctness: anthropic-vertex/claude-opus-5-5
      security: anthropic-vertex/claude-opus-5-5
      challenger: anthropic-vertex/claude-opus-5-5
      docs-currency: google-vertex/gemini-3.8-flash
      intent-coherence: google-vertex/gemini-3.8-flash
      risk-assessment: google-vertex/gemini-3.8-flash
      style-conventions: google-vertex/gemini-3.8-flash
      cross-repo-contracts: anthropic-vertex/claude-sonnet-4-6
      security-triage: anthropic-vertex/claude-haiku-4-5
    # TEMPORARY: withhold APPROVED reviews until Fullsend earns the team's trust.
    # Risk scores are 1-5; threshold 1 turns every approve verdict into a comment.
    # Keep REQUEST_CHANGES available for findings that need fixes.
    harness:
      env:
        runner:
          REVIEW_FINDING_SEVERITY_THRESHOLD: "medium"
          REVIEW_RISK_ASSESSMENT_ENABLED: "true"
          REVIEW_RISK_VERDICT_THRESHOLD: "1"
        sandbox:
          REVIEW_FINDING_SEVERITY_THRESHOLD: "medium"
          REVIEW_RISK_ASSESSMENT_ENABLED: "true"
          REVIEW_RISK_VERDICT_THRESHOLD: "1"
  - name: code
    source: https://raw.githubusercontent.com/fullsend-ai/agents/ea29de9bb8b1729b04c0597b48a5c7aae62deb71/harness/code.yaml#sha256=cfa49d4677cc4d6544fcf878e05b0f95620bbb62907289dbc5a22681a7679976
    enabled: true
    runtime: claude
    model: opus
  - name: fix
    source: https://raw.githubusercontent.com/fullsend-ai/agents/ea29de9bb8b1729b04c0597b48a5c7aae62deb71/harness/fix.yaml#sha256=994955a340553f30e8a0a43bb438af19c765d6986e5d54cee4783f6cc8b40315
    enabled: true
    model: claude-sonnet-4-6
  - name: retro
    source: https://raw.githubusercontent.com/fullsend-ai/agents/ea29de9bb8b1729b04c0597b48a5c7aae62deb71/harness/retro.yaml#sha256=89e2b4c57ef53b23b8964edbf204f7ab9bda18a6119803eb5d100b0869bfca53
    enabled: true
    model: claude-sonnet-4-6
    trigger: >-
      event.transition.kind == "comment_added"
      && has(event.transition.comment.command)
      && event.transition.comment.command == "/fs-retro"
      && event.actor.kind == "human"
  - name: prioritize
    source: https://raw.githubusercontent.com/fullsend-ai/agents/ea29de9bb8b1729b04c0597b48a5c7aae62deb71/harness/prioritize.yaml#sha256=6e17b6be217be53775b54cf19a7d025c458186fd5cd36d8061800f5d5e7e1060
    enabled: true
    runtime: pi
    model: google-vertex/gemini-3.8-flash
    # Override built-in routing explicitly so automatic events never select it.
    trigger: >-
      event.entity.kind in ["work_item", "change_proposal"]
      && event.transition.kind == "comment_added"
      && has(event.transition.comment.command)
      && event.transition.comment.command == "/fs-prioritize"
      && event.actor.kind == "human"

allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/fullsend/
  - https://raw.githubusercontent.com/fullsend-ai/agents/
