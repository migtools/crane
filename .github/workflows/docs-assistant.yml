name: Documentation Assistant

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  docs-assistant:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["stillalearner", "aufi", "Tamar-Dinavetsky", "nachandr", "midays", "istein1", "msajidmansoori12", "RanWurmbrand"]'), github.event.comment.user.login)
      ) &&
      (contains(github.event.comment.body, '[review-docs]') ||
       contains(github.event.comment.body, '[update-docs]') ||
       contains(github.event.comment.body, '[review-feature]'))

    steps:
      - name: Get PR information
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER=${{ github.event.issue.number }}
          echo "Extracting PR information for PR #$PR_NUMBER"

          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER)

          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
          HEAD_REPO=$(echo "$PR_DATA" | jq -r '.head.repo.full_name')
          BASE_SHA=$(echo "$PR_DATA" | jq -r '.base.sha')
          BASE_REF=$(echo "$PR_DATA" | jq -r '.base.ref')

          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "head_repo=$HEAD_REPO" >> $GITHUB_OUTPUT
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr_info.outputs.head_repo }}
          ref: ${{ steps.pr_info.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch PR Base Branch
        env:
          BASE_REF: ${{ steps.pr_info.outputs.base_ref }}
        run: |
          git remote add canonical "https://github.com/${{ github.repository }}.git" || true
          git fetch canonical "$BASE_REF:$BASE_REF" || true

      - name: Rebind Origin to Main Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://github.com/migtools/crane.git"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(echo -n "x-access-token:${GH_TOKEN}" | base64 -w 0)"

      - name: Documentation Assistant
        uses: redhat-community-ai-tools/code-to-docs@main
        with:
          model-api-base: ${{ secrets.MODEL_API_BASE }}
          model-api-key: ${{ secrets.MODEL_API_KEY }}
          model-name: ${{ secrets.MODEL_NAME }}
          docs-repo-url: ${{ secrets.DOCS_REPO_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr_info.outputs.pr_number }}
          pr-base: ${{ steps.pr_info.outputs.base_sha }}
          pr-head-sha: ${{ steps.pr_info.outputs.head_sha }}
          docs-subfolder: ${{ secrets.DOCS_SUBFOLDER }}
          comment-body: ${{ github.event.comment.body }}
          docs-base-branch: ${{ secrets.DOCS_BASE_BRANCH }}
          style-config-path: ".code-to-docs/style.md"
          #  jira-url: ${{ secrets.JIRA_URL }}
          # jira-username: ${{ secrets.JIRA_USERNAME }}
          # jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          #  google-sa-key: ${{ secrets.GOOGLE_SA_KEY }}
          # Optional: Uncomment and configure if custom context limits are needed
          #  max-context-chars: ${{ secrets.MAX_CONTEXT_CHARS }}

  docs-assistant-auto:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Get merged PR information
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AFTER_SHA: ${{ github.event.after }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          PR_DATA=$(gh api "repos/${{ github.repository }}/commits/$AFTER_SHA/pulls" --jq '.[0] // empty')
          if [ -z "$PR_DATA" ]; then
            echo "No PR found for this push, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
          PR_AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login')
          PR_ASSOCIATION=$(echo "$PR_DATA" | jq -r '.author_association')
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
          PR_MERGED_AT=$(echo "$PR_DATA" | jq -r '.merged_at')

          if [ "$PR_MERGED_AT" = "null" ] || [ -z "$PR_MERGED_AT" ]; then
            echo "PR not merged, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if ! echo "$PR_TITLE" | grep -qF ':sparkles:'; then
            echo "PR title does not contain :sparkles:, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          ALLOWED_ASSOC='["OWNER","MEMBER","COLLABORATOR"]'
          if ! echo "$ALLOWED_ASSOC" | jq -e --arg a "$PR_ASSOCIATION" 'contains([$a])' > /dev/null; then
            echo "PR author_association $PR_ASSOCIATION not allowed, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "head_sha=$AFTER_SHA" >> $GITHUB_OUTPUT
          echo "base_sha=$BEFORE_SHA" >> $GITHUB_OUTPUT

      - name: Checkout Main Repository
        if: steps.pr_info.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.after }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Documentation Assistant (Auto)
        if: steps.pr_info.outputs.skip != 'true'
        uses: redhat-community-ai-tools/code-to-docs@main
        with:
          model-api-base: ${{ secrets.MODEL_API_BASE }}
          model-api-key: ${{ secrets.MODEL_API_KEY }}
          model-name: ${{ secrets.MODEL_NAME }}
          docs-repo-url: ${{ secrets.DOCS_REPO_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr_info.outputs.pr_number }}
          pr-base: ${{ steps.pr_info.outputs.base_sha }}
          pr-head-sha: ${{ steps.pr_info.outputs.head_sha }}
          docs-subfolder: ${{ secrets.DOCS_SUBFOLDER }}
          comment-body: '[review-docs]'
          docs-base-branch: ${{ secrets.DOCS_BASE_BRANCH }}
          style-config-path: ".code-to-docs/style.md"
