name: Go build and unit tests
on: [push, pull_request]
jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Check out source code
        uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build packages and Crane binary
        working-directory: main
        env:
          GOPROXY: "https://proxy.golang.org"
        run: make build

      - name: Upload crane binary
        uses: actions/upload-artifact@v4
        with:
          name: crane-binary
          path: main/crane
          retention-days: 30

      # Live E2E suites require clusters; test-unit still covers their helpers.
      - name: Unit tests with coverage
        working-directory: main
        env:
          GOPROXY: "https://proxy.golang.org"
        run: |
          make test-unit GO_TEST_ARGS=-v COVERAGE_PROFILE=coverage.out COVERAGE_MODE=atomic
          echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Per-package coverage</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: Compile E2E suites without running tests
        working-directory: main
        env:
          GOPROXY: "https://proxy.golang.org"
        run: make test-e2e-compile

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > main/pr-number.txt

      - name: Upload coverage artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            main/coverage.out
            main/pr-number.txt

      - name: Coverage threshold check
        run: |
          cd main
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not parse coverage from coverage.out"
            exit 1
          fi
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=5
          if awk -v cov="$COVERAGE" -v thresh="$THRESHOLD" 'BEGIN {exit !(cov < thresh)}'; then
            echo "::error::Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi
