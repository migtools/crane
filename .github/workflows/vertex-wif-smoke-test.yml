name: Vertex WIF smoke test

on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model ID enabled in the GCP project
        type: string
        required: true
        default: claude-sonnet-4-6
      location:
        description: Vertex location serving the model
        type: string
        required: true
        default: global
      invoke_model:
        description: Also make one small Claude request after WIF authentication
        type: boolean
        default: true

permissions: {}

jobs:
  smoke-test:
    if: github.repository == 'migtools/crane'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.VERTEX_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.VERTEX_WIF_PROVIDER }}
    steps:
      - name: Check repository configuration
        run: |
          if [[ -z "$GCP_PROJECT" || -z "$WIF_PROVIDER" ]]; then
            echo '::error::Set the VERTEX_PROJECT_ID and VERTEX_WIF_PROVIDER repository variables.'
            exit 1
          fi

      # No checkout or credential file is needed: the REST call uses auth_token.
      - name: Exchange GitHub identity for a GCP federated token
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Confirm WIF exchange
        run: echo 'WIF exchange succeeded.'

      - name: Invoke Claude on Vertex AI
        if: inputs.invoke_model
        env:
          GCP_AUTH_TOKEN: ${{ steps.auth.outputs.auth_token }}
          MODEL_ID: ${{ inputs.model }}
          VERTEX_LOCATION: ${{ inputs.location }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          project = os.environ["GCP_PROJECT"]
          model = os.environ["MODEL_ID"]
          location = os.environ["VERTEX_LOCATION"]
          token = os.environ["GCP_AUTH_TOKEN"]
          if not re.fullmatch(r"claude-[a-z0-9][a-z0-9.@-]*", model):
              sys.exit("Invalid model ID. Use a Claude Vertex model ID without the anthropic/ publisher prefix.")
          if not re.fullmatch(r"[a-z]+(?:-[a-z0-9]+)*", location):
              sys.exit("Invalid Vertex location. Use global or a location such as us-east5.")
          if not token:
              sys.exit("WIF authentication did not return a federated token.")

          hosts = {
              "global": "aiplatform.googleapis.com",
              "us": "aiplatform.us.rep.googleapis.com",
              "eu": "aiplatform.eu.rep.googleapis.com",
          }
          host = hosts.get(location, f"{location}-aiplatform.googleapis.com")
          url = (
              f"https://{host}/v1/projects/{project}/locations/{location}"
              f"/publishers/anthropic/models/{model}:rawPredict"
          )
          payload = {
              "anthropic_version": "vertex-2023-10-16",
              "max_tokens": 16,
              "messages": [{"role": "user", "content": "Reply with OK."}],
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              # Report the API error without logging a bearer token or raw response.
              try:
                  body = json.load(error)
              except (json.JSONDecodeError, UnicodeDecodeError):
                  message = "The endpoint returned a non-JSON error."
              except OSError as read_error:
                  message = f"Could not read the API error response: {read_error}"
              else:
                  details = body.get("error") if isinstance(body, dict) else None
                  if isinstance(details, dict):
                      message = details.get("message") or "No API error message."
                  else:
                      message = "The endpoint returned JSON with an unexpected error shape."
              print(f"Vertex inference failed with HTTP {error.code}: {str(message).replace(token, '[REDACTED]')}", file=sys.stderr)
              print("WIF exchange passed. Check project IAM, model enablement, location, and quota.", file=sys.stderr)
              sys.exit(1)
          except (json.JSONDecodeError, UnicodeDecodeError):
              sys.exit("Vertex returned a successful HTTP status but the response was not valid JSON.")
          except OSError as error:
              sys.exit(f"Vertex request failed: {str(error).replace(token, '[REDACTED]')}")

          if not isinstance(result, dict) or not result.get("content") or not result.get("model"):
              sys.exit("Vertex returned JSON without the expected Claude model and content fields.")
          print(json.dumps({"project": project, "location": location, "model": result["model"], "usage": result.get("usage", {})}, indent=2))
          PY
