name: Cherry-pick to release branches
on:
  pull_request_target:
    branches:
      - main
    types:
      - closed
      - labeled

jobs:
  branches:
    if: >-
      github.event.pull_request.merged == true && (
        github.event.action == 'closed' ||
        (github.event.action == 'labeled' && startsWith(github.event.label.name, 'cherry-pick/'))
      )
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.cherry_pick_branches.outputs.result }}
    steps:
      - name: Check for cherry-pick labels and validate target branches
        id: cherry_pick_branches
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            let candidateBranches = [];

            if (context.eventName === 'pull_request_target' && context.payload.action === 'labeled') {
              const addedLabel = context.payload.label ? context.payload.label.name : '';
              if (addedLabel.startsWith('cherry-pick/')) {
                candidateBranches = [addedLabel.substr(12)];
              }
            } else {
              const labels = issue.labels.map(label => label.name);
              console.log(`Labels found: ${labels.join(', ')}`);
              candidateBranches = labels
               .filter(label => label.startsWith('cherry-pick/'))
               .map(label => label.substr(12));
            }

            console.log(`Candidate branches from labels: ${candidateBranches.join(', ')}`);

            const validBranches = [];

            for (const branch of candidateBranches) {
              try {
                await github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: branch,
                });
                validBranches.push(branch);
                console.log(`Branch '${branch}' exists in repo.`);
              } catch (error) {
                if (error.status === 404) {
                  console.warn(`Branch '${branch}' does NOT exist in the repo. Skipping cherry-pick for this branch.`);
                } else {
                  throw error;
                }
              }
            }

            console.log(`Valid target branches for cherry-pick: ${validBranches.join(', ')}`);
            return validBranches;   

  cherry-pick:
    runs-on: ubuntu-latest
    needs: branches
    if: ${{ needs.branches.outputs.branches != '[]' && needs.branches.outputs.branches != '' }}
    permissions:
      pull-requests: write
      contents: write
    strategy:
      matrix:
        branch: ${{ fromJson(needs.branches.outputs.branches) }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Get Token
        id: get_workflow_token
        uses: peter-murray/workflow-application-token-action@v3
        with:
          application_id: ${{ vars.MIGTOOLS_BOT_ID }}
          application_private_key: ${{ secrets.MIGTOOLS_BOT_KEY }}

      - name: Cherry-pick
        id: cherry_pick
        env:
          GH_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
          BRANCH_NAME: "cherry-pick-pr${{ github.event.number }}-${{ matrix.branch }}"
        run: |
          git config --global user.email "noreply@github.com"
          git config --global user.name "Cherry Picker"
          git checkout -b "${BRANCH_NAME}"
          git cherry-pick -s ${{ github.sha }}
          git push origin "${BRANCH_NAME}"
          PR_URL=$(gh pr create --base "${{ matrix.branch }}" --fill)
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Post success comment
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.get_workflow_token.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `PR cherry-picked to branch __${{ matrix.branch }}__. Backport PR: ${{ steps.cherry_pick.outputs.pr_url }}`
            });

      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.get_workflow_token.outputs.token }}
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Failed to cherry-pick this PR to branch __${{ matrix.branch }}__. [View failed action](${runUrl})`
            });
