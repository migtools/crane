# Based on Fullsend v0.57.1 internal/scaffold/fullsend-repo/.github/workflows/prioritize.yml.
# Local changes restrict execution to migtools/crane, read Vertex identifiers
# from repository variables, and forward optional runner/telemetry secrets.
# fullsend-stage: prioritize
name: Prioritize

permissions:
  actions: write
  contents: read
  id-token: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      event_type:
        description: Event type that triggered prioritization
        required: true
        type: string
      source_repo:
        description: Repository the event came from (owner/repo)
        required: true
        type: string
      event_payload:
        description: JSON-encoded payload of the triggering event
        required: true
        type: string
      project_number:
        description: GitHub Projects V2 project number for RICE scoring
        required: false
        type: string

concurrency:
  group: fullsend-prioritize-${{ inputs.source_repo }}-${{ fromJSON(inputs.event_payload).issue.number || fromJSON(inputs.event_payload).pull_request.number }}
  cancel-in-progress: true

jobs:
  prioritize:
    if: github.repository == 'migtools/crane' && inputs.source_repo == github.repository
    uses: fullsend-ai/fullsend/.github/workflows/reusable-prioritize.yml@d11de3ea0dde5aa652110b6716c19e000c426df7 # v0.57.1
    with:
      event_type: ${{ inputs.event_type }}
      source_repo: ${{ inputs.source_repo }}
      event_payload: ${{ inputs.event_payload }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      project_number: ${{ inputs.project_number || vars.FULLSEND_PROJECT_NUMBER }}
      runner_image: ubuntu-24.04
    secrets:
      # Upstream exposes these identifiers as secrets, but their source is vars.
      FULLSEND_GCP_WIF_PROVIDER: ${{ vars.VERTEX_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
      FULLSEND_GITHUB_RUNNER_SECRETS: ${{ secrets.FULLSEND_GITHUB_RUNNER_SECRETS }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
