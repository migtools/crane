# Sample namespace for MTC / Crane API-version skew experiments (OpenShift 4.14 -> 4.17).
#
# network.openshift.io/v1 (EgressNetworkPolicy) exists on 4.14 with OpenShift SDN but the
# network.openshift.io API group is not served on 4.17 (OVN / unified networking). After
# migration, Velero restore of this object should fail or be skipped; expect MigPlan GVK warning.
#
# Apply on SOURCE only:
#   oc apply -f mtc-gvk-api-skew-sample.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: mtc-gvk-api-skew
---
apiVersion: network.openshift.io/v1
kind: EgressNetworkPolicy
metadata:
  name: mtc-test-allow-all-egress
  namespace: mtc-gvk-api-skew
spec:
  egress:
    - type: Allow
      to:
        cidrSelector: 0.0.0.0/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pause-pods
  namespace: mtc-gvk-api-skew
  labels:
    app: pause-pods
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pause-pods
  template:
    metadata:
      labels:
        app: pause-pods
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
