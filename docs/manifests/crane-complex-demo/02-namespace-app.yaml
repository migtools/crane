---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: crane-complex-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: crane-complex-demo
data:
  APP_MODE: "demo"
  LOG_LEVEL: "info"
---
apiVersion: stable.example.com/v1
kind: Widget
metadata:
  name: demo-widget
  namespace: crane-complex-demo
spec:
  description: "Complex demo widget for crane export experiments"
  replicasHint: 1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crane-complex-demo-app-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["stable.example.com"]
    resources: ["widgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crane-complex-demo-app-sa-binding
subjects:
  - kind: ServiceAccount
    name: app-sa
    namespace: crane-complex-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crane-complex-demo-app-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: complex-demo-app
  namespace: crane-complex-demo
  labels:
    app.kubernetes.io/name: complex-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: complex-demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: complex-demo-app
    spec:
      serviceAccountName: app-sa
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/app-config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: complex-demo-svc
  namespace: crane-complex-demo
spec:
  selector:
    app.kubernetes.io/name: complex-demo-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
