# Cluster-scoped: custom SCC allowing the app ServiceAccount (for Crane SCC export filter via users[]).
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: crane-complex-demo-scc
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - KILL
  - MKNOD
  - SETUID
  - SETGID
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
users:
  # Populated after namespace exists; patch or apply 01b after project creation.
  - system:serviceaccount:crane-complex-demo:app-sa
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
