# Apply on the HOST cluster (migration hub / target), namespace openshift-migration.
# Requires MigCluster source-cluster + host and MigStorage automatic (same as a working MTC install).
#
# MigPlan and MigMigration can be applied together; the controller will reconcile the plan first.
---
apiVersion: migration.openshift.io/v1alpha1
kind: MigPlan
metadata:
  name: skew-test-plan
  namespace: openshift-migration
spec:
  destMigClusterRef:
    name: host
    namespace: openshift-migration
  migStorageRef:
    name: automatic
    namespace: openshift-migration
  namespaces:
    - mtc-skew-v2
  srcMigClusterRef:
    name: source-cluster
    namespace: openshift-migration
---
apiVersion: migration.openshift.io/v1alpha1
kind: MigMigration
metadata:
  name: skew-mig-1
  namespace: openshift-migration
spec:
  migPlanRef:
    name: skew-test-plan
    namespace: openshift-migration
  quiescePods: true
  stage: false
