# Source cluster (e.g. OCP 4.14) ONLY — do not apply the CRD on the target before migration.
#
# Contains:
#   - Namespace mtc-skew-v2
#   - CRD skewwidgets.skew.crane.test + SkewWidget instance (custom API absent on target until Velero restores CRD)
#   - Deployment + Service (standard types; control path)
#
# After CRD apply, wait for Established before creating the SkewWidget:
#   oc wait --for=condition=Established crd/skewwidgets.skew.crane.test --timeout=120s
#   oc apply -f - <<EOF ... SkewWidget ...
#
apiVersion: v1
kind: Namespace
metadata:
  name: mtc-skew-v2
  labels:
    migration.openshift.io/migrate: "true"
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: skewwidgets.skew.crane.test
spec:
  group: skew.crane.test
  names:
    kind: SkewWidget
    listKind: SkewWidgetList
    plural: skewwidgets
    singular: skewwidget
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: skew.crane.test/v1alpha1
kind: SkewWidget
metadata:
  name: demo-widget
  namespace: mtc-skew-v2
spec:
  note: "CRD-only-on-source test — wait for CRD Established before apply"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skew-demo
  namespace: mtc-skew-v2
  labels:
    app: skew-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skew-demo
  template:
    metadata:
      labels:
        app: skew-demo
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
---
apiVersion: v1
kind: Service
metadata:
  name: skew-demo
  namespace: mtc-skew-v2
spec:
  selector:
    app: skew-demo
  ports:
    - port: 80
      targetPort: 8080
