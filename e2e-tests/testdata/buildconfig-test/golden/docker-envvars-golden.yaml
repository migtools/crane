apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  annotations:
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    buildconfig-to-shipwright/inline-dockerfile-configmap: docker-envvars-dockerfile
    crane.konveyor.io/conversion-warnings: |-
      [buildconfig-test/docker-envvars] Inline Dockerfile on BuildConfig buildconfig-test/docker-envvars cannot be consumed by the buildah strategy; its content was preserved in ConfigMap buildconfig-test/docker-envvars-dockerfile (key Dockerfile). Commit it to the source repository as the Dockerfile, or see https://issues.redhat.com/browse/BUILD-1495, before running the Build.
      [buildconfig-test/docker-envvars] No source type specified for BuildConfig: docker-envvars
      [buildconfig-test/docker-envvars] Output ImageStreamTag "docker-envvars:latest" resolved to fallback URL: image-registry.openshift-image-registry.svc:5000/buildconfig-test/docker-envvars:latest
      [buildconfig-test/docker-envvars] No explicit pushSecret found for ImageStreamTag output. Ensure the BuildRun uses a ServiceAccount with internal registry push access.
      [buildconfig-test/docker-envvars] BuildConfig docker-envvars uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/docker-envvars
  labels:
    app: docker-test
  name: docker-envvars
  namespace: buildconfig-test
spec:
  env:
  - name: BUILD_LOGLEVEL
    value: "5"
  - name: HTTP_PROXY
    value: http://proxy.example.com:8080
  output:
    image: image-registry.openshift-image-registry.svc:5000/buildconfig-test/docker-envvars:latest
  source: null
  strategy:
    kind: ClusterBuildStrategy
    name: buildah
