apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  annotations:
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    crane.konveyor.io/conversion-warnings: |-
      [buildconfig-test/api-s2i] Output ImageStreamTag "api-s2i:latest" resolved to fallback URL: image-registry.openshift-image-registry.svc:5000/buildconfig-test/api-s2i:latest
      [buildconfig-test/api-s2i] No explicit pushSecret found for ImageStreamTag output. Ensure the BuildRun uses a ServiceAccount with internal registry push access.
      [buildconfig-test/api-s2i] BuildConfig api-s2i uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/api-s2i
  labels:
    app: api
  name: api-s2i
  namespace: buildconfig-test
spec:
  env:
  - name: NPM_MIRROR
    value: https://registry.npmjs.org
  output:
    image: image-registry.openshift-image-registry.svc:5000/buildconfig-test/api-s2i:latest
  paramValues:
  - configMapValue: null
    name: builder-image
    secretValue: null
    value: registry.access.redhat.com/ubi8/nodejs-16:latest
  - configMapValue: null
    name: registries-insecure
    secretValue: null
    values:
    - configMapValue: null
      secretValue: null
      value: image-registry.openshift-image-registry.svc:5000
  retention:
    failedLimit: 5
    succeededLimit: 5
  source:
    git:
      revision: master
      url: https://github.com/sclorg/nodejs-ex.git
    type: Git
  strategy:
    kind: ClusterBuildStrategy
    name: source-to-image
